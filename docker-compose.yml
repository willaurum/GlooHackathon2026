services:
  db:
    image: postgres:16-alpine
    container_name: gloo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gloo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gloo}
      POSTGRES_DB: ${POSTGRES_DB:-gloo}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"        # only so you can point a SQL client at it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gloo} -d ${POSTGRES_DB:-gloo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gloo-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gloo}:${POSTGRES_PASSWORD:-gloo}@db:5432/${POSTGRES_DB:-gloo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"        # only so you can hit the API / docs directly

  frontend:
    build: ./frontend
    container_name: gloo-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
