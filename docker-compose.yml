services:
  db:
    image: postgres:16-alpine
    container_name: gloo-db
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gloo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gloo}
      POSTGRES_DB: ${POSTGRES_DB:-gloo}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"        # only so you can point a SQL client at it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gloo} -d ${POSTGRES_DB:-gloo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The AI, in a container beside the backend. Nothing crosses to the host, so no
  # firewall rule, VPN or SSH tunnel is needed and it behaves the same on Linux,
  # macOS and Windows. Point OLLAMA_BASE_URL elsewhere to use a different endpoint.
  ollama:
    image: ollama/ollama:latest
    container_name: gloo-ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Downloads the model once into the ollama_models volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: gloo-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  backend:
    build: ./backend
    container_name: gloo-backend
    # Only for an AI endpoint on the host (an SSH tunnel, or Ollama installed natively).
    # The ollama service above needs none of this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gloo}:${POSTGRES_PASSWORD:-gloo}@db:5432/${POSTGRES_DB:-gloo}
      # The church database is a Durable Object in production; locally it is SQLite files
      # in the church_data volume.
      CHURCH_DB_URL: ${CHURCH_DB_URL:-sqlite}
      SQLITE_DB_DIR: /app/data
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_FALLBACK: ${AI_FALLBACK:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      GLOO_API_KEY: ${GLOO_API_KEY:-}
      GLOO_MODEL: ${GLOO_MODEL:-gloo-qwen-3.7-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      AI_BASE_URL: ${AI_BASE_URL:-${OLLAMA_BASE_URL:-http://ollama:11434/v1}}
      AI_MODEL: ${AI_MODEL:-${OLLAMA_MODEL:-llama3.2:3b}}
      AI_API_KEY: ${AI_API_KEY:-}
      NEWSDATA_API_KEY: ${NEWSDATA_API_KEY:-}
    # Local dev only: reload on code changes (start.sh, the production entrypoint, does not).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - church_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8000:8000"        # only so you can hit the API / docs directly

  frontend:
    build: ./frontend
    container_name: gloo-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
  church_data:
  ollama_models:
