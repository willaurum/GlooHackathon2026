services:
  db:
    image: postgres:16-alpine
    container_name: gloo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gloo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gloo}
      POSTGRES_DB: ${POSTGRES_DB:-gloo}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gloo} -d ${POSTGRES_DB:-gloo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gloo-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gloo}:${POSTGRES_PASSWORD:-gloo}@db:5432/${POSTGRES_DB:-gloo}
      AI_BASE_URL: ${AI_BASE_URL:-${OLLAMA_BASE_URL:-http://host.docker.internal:11434}}
      AI_MODEL: ${AI_MODEL:-${OLLAMA_MODEL:-qwen3.8:27b}}
      AI_API_KEY: ${AI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: gloo-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

volumes:
  db_data:
