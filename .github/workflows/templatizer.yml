name: Church template contract

on:
  pull_request:
    paths: ['templatizer/**', 'backend/**', '.github/workflows/templatizer.yml']
  push:
    branches: ['main', 'jaron-frontend', 'erik-map-highlights']
    paths: ['templatizer/**', 'backend/**', '.github/workflows/templatizer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s templatizer/tests -v
      - run: python -m unittest discover -s backend/tests -v
