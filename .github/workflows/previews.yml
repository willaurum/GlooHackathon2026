# One Cloudflare preview per branch, kept up to date automatically.
#
# - Every push to main or a team branch (jaron-*, ben-*, erik-*, will-*,
#   feature/*), merges included, builds that branch's frontend and deploys it
#   over its Worker on jaronwilson2025.workers.dev, so the preview always shows
#   the branch's latest commit. A newer push cancels an older one still running.
# - A pull request only builds, as a check; it deploys nothing, so unmerged
#   code never replaces the preview of the branch it goes into.
# - To redeploy by hand: Actions > Previews > Run workflow, pick the branch.
# - Branches with a wrangler.jsonc (jaron-*) deploy under the name in that file
#   and call the live APIs, whose ALLOWED_ORIGIN lists those names.
# - Older branches (a FastAPI + Postgres backend) get the frontend plus
#   preview-api-stub/, a same-origin stand-in API seeded from the branch's
#   backend/app/*.json. Its data is in memory and resets now and then.
# The token is only ever read from the CLOUDFLARE_API_TOKEN secret.
name: Previews

on:
  push:
    branches: ['main', 'jaron-*', 'ben-*', 'erik-*', 'will-*', 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, so it gets no preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUBDOMAIN: jaronwilson2025
      LIVE_API: https://gloo-hackathon2026-api-pastor-notes.jaronwilson2025.workers.dev
      LIVE_GIVING_API: https://gloo-hackathon2026-api-donate-giving.jaronwilson2025.workers.dev
      # A pull request builds but never deploys.
      DEPLOY: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Which branch, which kind, which Worker
        id: plan
        run: |
          # A pull request is checked out merged into the branch it goes into;
          # it builds as that branch would (it does not deploy).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then BRANCH="$GITHUB_BASE_REF"; else BRANCH="$GITHUB_REF_NAME"; fi
          SUFFIX="-gloo-hackathon2026"
          if [ -f wrangler.jsonc ] && [ -f frontend/package.json ]; then
            KIND=cloudflare
            WORKER=$(node -e "const t=require('fs').readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/mg,'');console.log(JSON.parse(t).name||'')")
          elif [ -f frontend/package.json ] && [ -d backend/app ]; then
            KIND=stub
            SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
            # Worker names can be 63 characters; shorten the branch part only.
            MAX=$((63 - ${#SUFFIX} - 8))
            SLUG=$(printf '%s' "${SLUG:0:$MAX}" | sed -E 's/-+$//')
            WORKER="preview-${SLUG:-branch}${SUFFIX}"
          else
            echo "::notice::No frontend to preview on $BRANCH."
            echo "kind=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$WORKER" in
            preview-*"$SUFFIX") ;;
            *) echo "::error::Refusing to deploy '$WORKER': preview Workers are named preview-...$SUFFIX."; exit 1 ;;
          esac
          echo "Branch $BRANCH, kind $KIND, Worker $WORKER"
          { echo "branch=$BRANCH"; echo "kind=$KIND"; echo "worker=$WORKER"; echo "url=https://$WORKER.$SUBDOMAIN.workers.dev"; } >> "$GITHUB_OUTPUT"

      - name: Cloudflare account
        if: steps.plan.outputs.kind != 'none' && env.DEPLOY == 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set."; exit 1; fi
          ACCOUNT="${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result||[];if(r.length!==1){console.error('token sees '+r.length+' accounts; set the CLOUDFLARE_ACCOUNT_ID variable');process.exit(1)}console.log(r[0].id)})")
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Build the frontend
        if: steps.plan.outputs.kind != 'none'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          if [ "${{ steps.plan.outputs.kind }}" = "cloudflare" ]; then
            export VITE_API_BASE="$LIVE_API" VITE_GIVING_API_BASE="$LIVE_GIVING_API"
          fi
          npm run build

      - name: Deploy (branch with its own wrangler.jsonc)
        if: steps.plan.outputs.kind == 'cloudflare' && env.DEPLOY == 'true'
        run: npx --yes wrangler@4 deploy

      - name: Deploy (frontend + stand-in API)
        if: steps.plan.outputs.kind == 'stub' && env.DEPLOY == 'true'
        run: |
          node preview-api-stub/make-seed.mjs
          cat > preview.wrangler.jsonc <<JSON
          {
            "name": "${{ steps.plan.outputs.worker }}",
            "main": "preview-api-stub/index.js",
            "compatibility_date": "2026-09-01",
            "assets": {
              "directory": "frontend/dist",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*"]
            }
          }
          JSON
          npx --yes wrangler@4 deploy --config preview.wrangler.jsonc

      - name: Check it answers
        if: steps.plan.outputs.kind != 'none' && env.DEPLOY == 'true'
        run: |
          URL="${{ steps.plan.outputs.url }}"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          echo "Frontend: HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::$URL did not answer 200"; exit 1; }
          if [ "${{ steps.plan.outputs.kind }}" = "stub" ]; then
            # A new Worker can serve its files a few seconds before its code.
            for i in $(seq 1 12); do
              curl -fsS "$URL/api/health" 2>/dev/null | grep -q '"ok":true' && break
              [ "$i" = 12 ] && { echo "::error::$URL/api/health did not answer ok"; exit 1; }
              sleep 5
            done
            curl -fsS "$URL/api/ministries" -o /dev/null || { echo "::error::$URL/api/ministries failed"; exit 1; }
          fi
          echo "::notice::Preview for ${{ steps.plan.outputs.branch }}: $URL"
          { echo "### Preview for \`${{ steps.plan.outputs.branch }}\`"; echo "$URL"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Link the preview on the pull request
        # Once, when the pull request is opened.
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && steps.plan.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "This builds. Once it is merged, the preview of \`${{ steps.plan.outputs.branch }}\` updates on its own: ${{ steps.plan.outputs.url }}"
