# Previews, including one per open pull request.
#
# - Every push to main or a team branch (jaron-*, ben-*, erik-*, will-*,
#   feature/*), merges included, builds that branch's frontend and deploys it
#   over its own Worker on jaronwilson2025.workers.dev, so the preview always
#   shows the branch's latest commit. A newer push cancels an older one still
#   running.
# - A pull request builds AND deploys, but always to its own
#   preview-pr-<number> Worker, never the branch it targets and never the
#   live site (even a pull request into main) — so you can see what merging
#   would actually look like before you merge it, and merging it never races
#   an in-review change against the branch's own preview. The bot comment on
#   the pull request updates on every push to it, and also says which link
#   updates once it is merged.
# - Closing a pull request (merged or not) deletes its preview-pr-<number>
#   Worker, so these do not pile up.
# - To redeploy a branch by hand: Actions > Previews > Run workflow, pick it.
# - main has a wrangler.jsonc: it deploys under the name in that file, which
#   is the live site, and calls the live APIs (their ALLOWED_ORIGIN lists
#   it). Only a push to main deploys there. Any other branch or pull request
#   with that wrangler.jsonc (every branch made from main) gets its own
#   Worker, whose preview-proxy/ forwards /api calls to the live APIs, so
#   nothing but main ever replaces the live site.
# - Older branches (a FastAPI + Postgres backend) get the frontend plus
#   preview-api-stub/, a same-origin stand-in API seeded from the branch's
#   backend/app/*.json. Its data is in memory and resets now and then.
# The token is only ever read from the CLOUDFLARE_API_TOKEN secret.
name: Previews

on:
  push:
    branches: ['main', 'jaron-*', 'ben-*', 'erik-*', 'will-*', 'isaac-*', 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, so it gets no preview.
    # Closing a pull request is handled by the cleanup job below instead.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUBDOMAIN: jaronwilson2025
      LIVE_API: https://gloo-hackathon2026-api-pastor-notes.jaronwilson2025.workers.dev
      LIVE_GIVING_API: https://gloo-hackathon2026-api-donate-giving.jaronwilson2025.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Which branch, which kind, which Worker
        id: plan
        run: |
          # A pull request is checked out merged into the branch it targets,
          # so it builds and deploys as that merge would look — but always
          # under its own preview-pr-<number> Worker, never the target
          # branch's own preview and never the live site, regardless of
          # what branch it targets.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then BRANCH="$GITHUB_BASE_REF"; else BRANCH="$GITHUB_REF_NAME"; fi
          SUFFIX="-gloo-hackathon2026"
          SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          # Worker names can be 63 characters; shorten the branch part only.
          MAX=$((63 - ${#SUFFIX} - 8))
          SLUG=$(printf '%s' "${SLUG:0:$MAX}" | sed -E 's/-+$//')
          BRANCH_WORKER="preview-${SLUG:-branch}${SUFFIX}"
          PR_WORKER="preview-pr-${{ github.event.pull_request.number }}${SUFFIX}"
          if [ -f wrangler.jsonc ] && [ -f frontend/package.json ]; then
            LIVE=$(node -e "const t=require('fs').readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/mg,'');console.log(JSON.parse(t).name||'')")
            echo "live_origin=https://$LIVE.$SUBDOMAIN.workers.dev" >> "$GITHUB_OUTPUT"
            if [ "$BRANCH" = "main" ]; then TARGET_WORKER="$LIVE"; else TARGET_WORKER="$BRANCH_WORKER"; fi
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              KIND=proxy; WORKER="$PR_WORKER"
            elif [ "$BRANCH" = "main" ]; then
              KIND=cloudflare; WORKER="$LIVE"
            else
              # Only a push to main is the live site.
              KIND=proxy; WORKER="$BRANCH_WORKER"
              [ "$WORKER" = "$LIVE" ] && { echo "::error::Branch $BRANCH would deploy over the live site ($LIVE); rename the branch."; exit 1; }
            fi
          elif [ -f frontend/package.json ] && [ -d backend/app ]; then
            TARGET_WORKER="$BRANCH_WORKER"
            KIND=stub
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then WORKER="$PR_WORKER"; else WORKER="$BRANCH_WORKER"; fi
          else
            echo "::notice::No frontend to preview on $BRANCH."
            echo "kind=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$WORKER" in
            preview-*"$SUFFIX") ;;
            # Only a push to main may deploy the live Worker (KIND=cloudflare is set for main alone).
            "$LIVE") [ "$KIND" = cloudflare ] || { echo "::error::Only main deploys the live site ($LIVE)."; exit 1; } ;;
            *) echo "::error::Refusing to deploy '$WORKER': preview Workers are named preview-...$SUFFIX."; exit 1 ;;
          esac
          echo "Branch $BRANCH, kind $KIND, Worker $WORKER"
          {
            echo "branch=$BRANCH"; echo "kind=$KIND"; echo "worker=$WORKER";
            echo "url=https://$WORKER.$SUBDOMAIN.workers.dev";
            echo "target_url=https://$TARGET_WORKER.$SUBDOMAIN.workers.dev";
          } >> "$GITHUB_OUTPUT"

      - name: Cloudflare account
        if: steps.plan.outputs.kind != 'none'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set."; exit 1; fi
          ACCOUNT="${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result||[];if(r.length!==1){console.error('token sees '+r.length+' accounts; set the CLOUDFLARE_ACCOUNT_ID variable');process.exit(1)}console.log(r[0].id)})")
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Build the frontend
        if: steps.plan.outputs.kind != 'none'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          case "${{ steps.plan.outputs.kind }}" in
            cloudflare) export VITE_API_BASE="$LIVE_API" VITE_GIVING_API_BASE="$LIVE_GIVING_API" ;;
            # Same-origin; preview-proxy/ forwards these to the live APIs.
            proxy) export VITE_API_BASE="" VITE_GIVING_API_BASE="/giving-api" ;;
          esac
          npm run build

      - name: Deploy (branch with its own wrangler.jsonc)
        if: steps.plan.outputs.kind == 'cloudflare'
        run: npx --yes wrangler@4 deploy

      - name: Deploy (branch or pull request of the Cloudflare app, own Worker)
        if: steps.plan.outputs.kind == 'proxy'
        run: |
          cat > preview.wrangler.jsonc <<JSON
          {
            "name": "${{ steps.plan.outputs.worker }}",
            "main": "preview-proxy/index.js",
            "compatibility_date": "2026-09-01",
            "assets": {
              "directory": "frontend/dist",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*", "/giving-api/*"]
            },
            "services": [
              { "binding": "CHURCH_API", "service": "gloo-hackathon2026-api-pastor-notes" },
              { "binding": "GIVING_API", "service": "gloo-hackathon2026-api-donate-giving" }
            ],
            "vars": {
              "LIVE_API": "$LIVE_API",
              "LIVE_GIVING_API": "$LIVE_GIVING_API",
              "LIVE_ORIGIN": "${{ steps.plan.outputs.live_origin }}"
            }
          }
          JSON
          npx --yes wrangler@4 deploy --config preview.wrangler.jsonc

      - name: Deploy (frontend + stand-in API)
        if: steps.plan.outputs.kind == 'stub'
        run: |
          node preview-api-stub/make-seed.mjs
          cat > preview.wrangler.jsonc <<JSON
          {
            "name": "${{ steps.plan.outputs.worker }}",
            "main": "preview-api-stub/index.js",
            "compatibility_date": "2026-09-01",
            "assets": {
              "directory": "frontend/dist",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*"]
            }
          }
          JSON
          npx --yes wrangler@4 deploy --config preview.wrangler.jsonc

      - name: Check it answers
        if: steps.plan.outputs.kind != 'none'
        run: |
          URL="${{ steps.plan.outputs.url }}"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          echo "Frontend: HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::$URL did not answer 200"; exit 1; }
          if [ "${{ steps.plan.outputs.kind }}" = "proxy" ]; then
            # The forwarded church API answers through this Worker.
            for i in $(seq 1 12); do
              curl -fsS "$URL/api/ministries" -o /dev/null 2>/dev/null && break
              [ "$i" = 12 ] && { echo "::error::$URL/api/ministries did not answer through the proxy"; exit 1; }
              sleep 5
            done
          fi
          if [ "${{ steps.plan.outputs.kind }}" = "stub" ]; then
            # A new Worker can serve its files a few seconds before its code.
            for i in $(seq 1 12); do
              curl -fsS "$URL/api/health" 2>/dev/null | grep -q '"ok":true' && break
              [ "$i" = 12 ] && { echo "::error::$URL/api/health did not answer ok"; exit 1; }
              sleep 5
            done
            curl -fsS "$URL/api/ministries" -o /dev/null || { echo "::error::$URL/api/ministries failed"; exit 1; }
          fi
          echo "::notice::Preview for ${{ steps.plan.outputs.branch }}: $URL"
          { echo "### Preview for \`${{ steps.plan.outputs.branch }}\`"; echo "$URL"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Link the preview on the pull request
        # On every push to the pull request, not just when it is opened, so
        # the comment always points at the latest commit's own preview.
        if: github.event_name == 'pull_request' && steps.plan.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- previews.yml:pr-${{ github.event.pull_request.number }} -->"
          {
            echo "$MARKER"
            echo "### Preview of this pull request"
            echo "${{ steps.plan.outputs.url }}"
            echo ""
            echo "This is what merging into \`${{ steps.plan.outputs.branch }}\` would look like, rebuilt on every push here. Once merged, \`${{ steps.plan.outputs.branch }}\`'s own preview updates separately: ${{ steps.plan.outputs.target_url }}"
          } > /tmp/pr-preview-comment.md
          jq -Rs '{body: .}' < /tmp/pr-preview-comment.md > /tmp/pr-preview-comment.json
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" --input /tmp/pr-preview-comment.json
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" --input /tmp/pr-preview-comment.json
          fi

  cleanup:
    runs-on: ubuntu-latest
    # Closing a pull request (merged or not) removes its preview Worker so
    # these do not pile up. A fork pull request never deployed one.
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Cloudflare account
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set."; exit 1; fi
          ACCOUNT="${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result||[];if(r.length!==1){console.error('token sees '+r.length+' accounts; set the CLOUDFLARE_ACCOUNT_ID variable');process.exit(1)}console.log(r[0].id)})")
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Delete this pull request's preview Worker
        run: |
          npx --yes wrangler@4 delete --name "preview-pr-${{ github.event.pull_request.number }}-gloo-hackathon2026" \
            || echo "::notice::Nothing to delete (this pull request may never have built a preview)."
