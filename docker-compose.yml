services:
  db:
    image: postgres:16-alpine
    container_name: gloo-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gloo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gloo}
      POSTGRES_DB: ${POSTGRES_DB:-gloo}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"        # only so you can point a SQL client at it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gloo} -d ${POSTGRES_DB:-gloo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gloo-backend
    extra_hosts:
      - "host.docker.internal:172.21.0.1"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gloo}:${POSTGRES_PASSWORD:-gloo}@db:5432/${POSTGRES_DB:-gloo}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_FALLBACK: ${AI_FALLBACK:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      GLOO_API_KEY: ${GLOO_API_KEY:-}
      GLOO_MODEL: ${GLOO_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"        # only so you can hit the API / docs directly

  frontend:
    build: ./frontend
    container_name: gloo-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
